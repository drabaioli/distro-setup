-- Minimal right-aligned desktop widget: time, date, system info, each with an accent bar.
conky.config = {
    alignment = 'middle_right',
    gap_x = 80,
    gap_y = 0,
    minimum_width = 440,
    maximum_width = 440,
    update_interval = 1,
    double_buffer = true,
    own_window = true,
    own_window_type = 'desktop',
    own_window_class = 'conky',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    use_xft = true,
    font = 'Ubuntu:size=12',
    default_color = 'f2f2f2',
    color1 = 'ff5f6d',
    color2 = 'ffc371',
    color3 = '9b8cff',
    color4 = '9aa0b4',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    cpu_avg_samples = 2,
    short_units = true,
    minimum_height = 280,
    lua_load = '~/.config/conky/bars.lua',
    lua_draw_hook_pre = 'draw_bars',
    text_buffer_size = 2048,
}

conky.text = [[
${alignr 30}${font Ubuntu:bold:size=59}${time %H:%M:%S}${font}
${alignr 30}${color4}${time %A}${color}
${alignr 30}${time %d %B %Y}
${voffset 24}${alignr 30}${font Ubuntu:bold:size=18}SYSTEM${font}
${goto 318}${color4}CPU${color}${alignr 30}${cpu cpu0}%
${goto 318}${color4}RAM${color}${alignr 30}${memperc}%
${goto 318}${color4}DISK${color}${alignr 30}${fs_used_perc /}%
]]
