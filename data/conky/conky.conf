-- Minimal right-aligned desktop widget: time, date, system info, each on a dark translucent rounded panel.
conky.config = {
    alignment = 'bottom_right',
    gap_x = 80,
    gap_y = 80,
    minimum_width = 260,
    maximum_width = 260,
    update_interval = 2,
    double_buffer = true,
    own_window = true,
    own_window_type = 'desktop',
    own_window_class = 'conky',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    use_xft = true,
    font = 'Ubuntu:size=12',
    default_color = 'f2f2f2',
    color1 = 'ff5f6d',
    color2 = 'ffc371',
    color3 = '9b8cff',
    color4 = '9aa0b4',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    cpu_avg_samples = 2,
    short_units = true,
    minimum_height = 316,
    lua_load = '~/.config/conky/panels.lua',
    lua_draw_hook_pre = 'draw_panels',
    text_buffer_size = 2048,
}

conky.text = [[
${voffset 4}${alignc}${font Ubuntu:bold:size=59}${time %H}${font Ubuntu:light:size=59}${time :%M}${font}
${alignc}${color4}${time %A}${color}
${alignc}${time %d %B %Y}
${voffset 74}${alignc}${font Ubuntu:bold:size=18}SYSTEM${font}
${goto 88}${color4}CPU${color}${alignr 82}${cpu cpu0}%
${goto 88}${color4}RAM${color}${alignr 82}${memperc}%
${goto 88}${color4}DISK${color}${alignr 82}${fs_used_perc /}%
]]
